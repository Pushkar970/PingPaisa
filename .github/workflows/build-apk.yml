name: Build Android APK

on:
  push:
    branches: [main]
    paths:
      - 'react_native_space/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:
    inputs:
      api_url:
        description: 'Optional EXPO_PUBLIC_API_URL override (defaults to repository variable EXPO_PUBLIC_API_URL)'
        required: false
        type: string

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable Corepack (Yarn 4)
        run: corepack enable

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install dependencies
        working-directory: react_native_space
        run: yarn install

      - name: Prebuild Android project
        working-directory: react_native_space
        env:
          EXPO_PUBLIC_API_URL: ${{ inputs.api_url || vars.EXPO_PUBLIC_API_URL }}
        run: npx expo prebuild --platform android --non-interactive

      - name: Build Release APK
        working-directory: react_native_space/android
        env:
          EXPO_PUBLIC_API_URL: ${{ inputs.api_url || vars.EXPO_PUBLIC_API_URL }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: pingpaisa-release-apk
          path: react_native_space/android/app/build/outputs/apk/release/app-release.apk
          retention-days: 30
